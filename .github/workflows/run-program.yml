name: Run Script Every Other Day

on:
  schedule:
    # This CRON expression tells GitHub to run the script at 00:00 UTC every 2 days
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows you to also trigger it manually with a button click

jobs:
  run-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (optional)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run the script
        run: python auto_job_monitor
